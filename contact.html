<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Contact | Willona's Decor & Events</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; font-family: Georgia, 'Times New Roman', serif; background: #1a0a00; color: #fff; overflow-x: hidden; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .site-header { background: #FFCBA4; padding: 8px 8px 6px; text-align: center; border-bottom: 1px solid #e8c98a; }
    .logo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #c9963a; display: block; margin: 0 auto 4px; }
    .brand-name { font-size: 11px; font-weight: 700; color: #7a4a00; letter-spacing: 0.06em; margin-bottom: 1px; }
    .slogan { font-size: 9px; color: #7a4a00; font-style: italic; margin-bottom: 6px; line-height: 1.3; }
    .nav-buttons { display: flex; justify-content: center; align-items: center; gap: 4px; width: 100%; flex-wrap: nowrap; padding: 0 4px; }
    .nav-btn { font-family: Arial, sans-serif; font-weight: 700; color: #7a4a00; background: transparent; border: 1px solid #7a4a00; border-radius: 20px; text-decoration: none; white-space: nowrap; font-size: clamp(7px, 2.2vw, 10px); padding: 4px clamp(5px, 1.8vw, 9px); flex-shrink: 0; }

    .main-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .section-content { text-align: center; width: 100%; max-width: 400px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 24px 18px; border-radius: 18px; }
    h2 { font-size: 18px; color: #fff; margin-bottom: 15px; }
    .contact-info { margin: 15px 0; font-size: 13px; font-family: Arial, sans-serif; line-height: 1.5; }
    .cta-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .cta-btn { width: 100%; display: block; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; border-radius: 22px; padding: 14px; text-decoration: none; color: #fff; background: #996515; text-align: center; }

    footer { background: #7a4a00; padding: 7px 10px; text-align: center; }
    footer p { font-family: Arial, sans-serif; font-size: 9px; color: #FFCBA4; }
  </style>
</head>
<body>
  <header class="site-header">
    <img src="willona.png" alt="Willona's Logo" class="logo">
    <div class="brand-name">WILLONA'S™</div>
    <p class="slogan"><em>We design moments that take your breath away.</em></p>
    <nav class="nav-buttons">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="services.html" class="nav-btn">Services</a>
      <a href="gallery.html" class="nav-btn">Gallery</a>
      <a href="contact.html" class="nav-btn">Contact</a>
      <a href="faq.html" class="nav-btn">FAQ</a>
    </nav>
  </header>

  <main class="main-container">
    <div class="section-content">
      <h2>Contact Us</h2>
      <p class="contact-info">
        <i class="fas fa-map-marker-alt"></i> 530 Buthelezi Street, Twala Section, Katlehong, Germiston, 1431
      </p>
      <div class="cta-buttons">
        <a href="https://wa.me/27685546465" target="_blank" class="cta-btn">
          <i class="fab fa-whatsapp"></i> WhatsApp Us
        </a>
        <a href="mailto:Mimi.Makhubo605@gmail.com" class="cta-btn">
          <i class="fas fa-envelope"></i> Send an Email
        </a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 Willona's™ — We design moments that take your breath away.</p></footer>
</body>
</html>
