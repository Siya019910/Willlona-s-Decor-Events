<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  /* Critical for mobile scaling */
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Contact | Willona’s Decor & Events</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <style>
    /* Prevent any horizontal sliding/scrolling */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden; /* Fixes sliding */
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
    }

    /* ===== Section 1: Header ===== */
    .section1 {
      text-align: center;
      padding: 10px 5px;
      background-color: #FFCBA4;
      color: #996515;
      width: 100%;
    }

    /* Logo: Medium Size */
    .logo {
      width: 150px; 
      height: auto;
      max-width: 60%;
      margin-bottom: 5px;
    }

    .slogan {
      margin: 5px auto 12px;
      font-size: 0.95rem;
      max-width: 95%;
      line-height: 1.2;
    }

    /* Navigation: Forced Straight Line */
    .nav-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap; /* Ensures straight line */
      gap: 4px; /* Space between items */
      width: 100%;
      padding: 0 5px;
    }

    .nav-btn {
      padding: 6px 4px;
      font-size: 0.65rem; /* Small enough to fit all screens */
      flex: 1; /* Distributes space equally */
      max-width: 75px;
      border-radius: 12px;
      background-color: rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
      color: black;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid rgba(153, 101, 21, 0.3);
      transition: all 0.3s ease;
      text-align: center;
      white-space: nowrap; /* Keeps text on one line */
    }

    .nav-btn:hover {
      background-color: #996515;
      color: white;
    }

    /* ===== Section 2: Contact ===== */
    .section2 {
      flex: 1;
      padding: 40px 15px;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img.jpeg') no-repeat center center;
      background-size: cover;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-content {
      width: 100%;
      max-width: 600px;
      padding: 15px;
      border-radius: 15px;
    }

    .section-content h2 {
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .section-content p {
      margin: 15px 0;
      font-size: 0.9rem;
      word-wrap: break-word;
    }

    .contact-btn {
      display: inline-block;
      margin: 8px auto;
      padding: 10px 20px;
      background-color: #FFCBA4;
      color: #996515;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
      width: 90%; /* Better for mobile tapping */
      max-width: 300px;
    }

    /* ===== Footer: Decreased Size ===== */
    footer {
      text-align: center;
      padding: 10px 5px; /* Minimal padding */
      background-color: #996515;
      color: #FFCBA4;
      font-size: 0.75rem; /* Smaller font */
      width: 100%;
    }

    footer p {
      margin: 0;
    }

    /* ===== Mobile Specific Adjustments ===== */
    @media (max-width: 380px) {
      .nav-btn {
        font-size: 0.6rem;
        padding: 5px 2px;
      }
      .slogan {
        font-size: 0.85rem;
      }
      .logo {
        width: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- Section 1: Header -->
  <div class="section1">
    <img src="willona.png" alt="Willona Logo" class="logo" />
    <h1 class="slogan">
      <b><i>We don’t just decorate spaces—we design moments.</i></b>
    </h1>
    
    <!-- Straight line navigation -->
    <div class="nav-buttons">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="services.html" class="nav-btn">Services</a>
      <a href="gallery.html" class="nav-btn">Gallery</a>
      <a href="contact.html" class="nav-btn">Contact</a>
      <a href="faq.html" class="nav-btn">FAQ</a>
    </div>
  </div>

  <!-- Section 2: Contact -->
  <div class="section2">
    <div class="section-content">
      <h2>Contact Us</h2>
      <p><i class="fas fa-map-marker-alt"></i> 530 Buthelezi Street, Twala Section, Katlehong, Germiston, 1431</p>
      
      <a href="https://wa.me/27685546465" target="_blank" class="contact-btn">
        <i class="fab fa-whatsapp"></i> 0685546465
      </a>
      
      <a href="mailto:Mimi.Makhubo605@gmail.com" target="_blank" class="contact-btn">
        <i class="fas fa-envelope"></i> Email Us
      </a>
    </div>
  </div>

  <!-- Footer (Small & Compact) -->
  <footer>
    <p>© 2025 Willona’s™ — Design Moments.</p>
  </footer>

</body>
</html>
