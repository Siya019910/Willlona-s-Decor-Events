<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Contact | Willona's Decor & Events</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Georgia, 'Times New Roman', serif; background: #1a0a00; color: #fff; overflow-x: hidden; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── HEADER (Matched to index.html) ── */
    .site-header {
      background: #FFCBA4;
      padding: 10px 12px 8px;
      text-align: center;
      border-bottom: 1px solid #e8c98a;
    }
    .logo {
      width: 62px; height: 62px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c9963a;
      display: block;
      margin: 0 auto 6px;
    }
    .brand-name { font-size: 13px; font-weight: 700; color: #7a4a00; letter-spacing: 0.06em; margin-bottom: 2px; }
    .slogan { font-size: 10px; color: #7a4a00; font-style: italic; letter-spacing: 0.03em; margin-bottom: 10px; line-height: 1.4; }

    /* ── NAV (Wrapped for Mobile) ── */
    .nav-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; width: 100%; }
    .nav-btn {
      font-family: Arial, sans-serif; font-size: 10px; font-weight: 700;
      color: #7a4a00; background: transparent; border: 1px solid #7a4a00;
      border-radius: 20px; padding: 5px 10px; text-decoration: none; white-space: nowrap;
    }

    /* ── MAIN CONTENT AREA ── */
    .main-container {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: #1a0a00;
    }
    .section-content {
      text-align: center; width: 100%; max-width: 400px;
      background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
      padding: 24px; border-radius: 20px;
    }
    h2 { font-size: 18px; color: #fff; margin-bottom: 15px; }
    .contact-info { margin: 15px 0; font-size: 13px; font-family: Arial, sans-serif; line-height: 1.5; }

    /* ── CTA BUTTONS (Full Width) ── */
    .cta-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .cta-btn {
      width: 100%; display: block; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700;
      border-radius: 22px; padding: 14px; text-decoration: none;
      color: #fff; background: #996515; text-align: center;
    }

    /* ── FOOTER ── */
    footer { background: #7a4a00; padding: 10px; text-align: center; }
    footer p { font-size: 9px; color: #FFCBA4; }
  </style>
</head>
<body>

  <header class="site-header">
    <img src="willona.png" alt="Willona's Logo" class="logo">
    <div class="brand-name">WILLONA'S™</div>
    <p class="slogan"><em>We design moments that take your breath away.</em></p>
    <nav class="nav-buttons">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="services.html" class="nav-btn">Services</a>
      <a href="gallery.html" class="nav-btn">Gallery</a>
      <a href="contact.html" class="nav-btn">Contact</a>
      <a href="faq.html" class="nav-btn">FAQ</a>
    </nav>
  </header>

  <main class="main-container">
    <div class="section-content">
      <h2>Contact Us</h2>
      <p class="contact-info">
        <i class="fas fa-map-marker-alt"></i> 530 Buthelezi Street, Twala Section, Katlehong, Germiston, 1431
      </p>
      
      <div class="cta-buttons">
        <a href="https://wa.me/27685546465" target="_blank" class="cta-btn">
          <i class="fab fa-whatsapp"></i> WhatsApp Us
        </a>
        <a href="mailto:Mimi.Makhubo605@gmail.com" class="cta-btn">
          <i class="fas fa-envelope"></i> Send an Email
        </a>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 Willona's™ — We design moments that take your breath away.</p>
  </footer>

</body>
</html>
