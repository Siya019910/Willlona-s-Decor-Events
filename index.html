<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Willona’s Decor & Events</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #fffaf0; color: #5d4037; overflow-x: hidden; }
    body { display: flex; flex-direction: column; }
    
    /* Top Section - Slimmed down */
    .section1 { background-color: #fdf5e6; text-align: center; padding: 5px 2px; border-bottom: 1px solid #e0c9a6; }
    .logo { width: 60px; margin-bottom: 2px; }
    .slogan { font-size: 0.7rem; margin: 2px 0; color: #b8860b; }
    
    /* Straight Aligned Small Buttons */
    .nav-buttons { display: flex; justify-content: center; gap: 2px; padding: 2px 0; }
    .nav-btn { padding: 3px 5px; font-size: 0.55rem; border-radius: 3px; background: #fff; color: #8b4513; text-decoration: none; border: 1px solid #d2b48c; white-space: nowrap; font-weight: bold; }

    /* Elegant Light Shadow Box */
    .section2 { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; background: #fffaf0; }
    .section-content { 
      width: 100%; max-width: 320px; padding: 15px; text-align: center; 
      background: #ffffff; border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(139, 69, 19, 0.15);
      border: 1px solid #eee8aa;
    }
    h2 { font-size: 1rem; color: #8b4513; margin: 0 0 8px 0; }
    p { font-size: 0.75rem; margin-bottom: 12px; line-height: 1.4; color: #555; }
    
    .cta-buttons { display: flex; flex-direction: column; gap: 6px; }
    .cta-btn { padding: 6px; border-radius: 15px; text-decoration: none; font-size: 0.75rem; border: 1px solid #d2b48c; color: #8b4513; background: #fff; }
    
    /* Small Footer */
    footer { text-align: center; padding: 5px; background-color: #fdf5e6; color: #8b4513; font-size: 0.6rem; border-top: 1px solid #e0c9a6; }
  </style>
</head>
<body>

  <div class="section1">
    <img src="willona.png" alt="Willona Logo" class="logo">
    <div class="slogan"><i>We design moments that take your breath away.</i></div>
    <div class="nav-buttons">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="services.html" class="nav-btn">Services</a>
      <a href="gallery.html" class="nav-btn">Gallery</a>
      <a href="contact.html" class="nav-btn">Contact</a>
      <a href="faq.html" class="nav-btn">FAQ</a>
    </div>
  </div>

  <div class="section2">
    <div class="section-content">
      <h2>Welcome to Willona’s</h2>
      <p>Every occasion deserves beauty, elegance, and a touch of magic.</p>
      <div class="cta-buttons">
        <a href="https://wa.me/27685546465" class="cta-btn"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <a href="mailto:Mimi.Makhubo605@gmail.com" class="cta-btn"><i class="fas fa-envelope"></i> Email</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 Willona’s™ - We design moments that take your breath away.</p>
  </footer>
</body>
</html>
