<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Willona’s Decor & Events</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #111; color: #fff; overflow-x: hidden; }
    body { display: flex; flex-direction: column; }
    
    .section1 { background-color: #FFCBA4; color: #996515; text-align: center; padding: 10px 5px; }
    .logo { width: 80px; max-width: 100%; margin-bottom: 2px; } /* Reduced size */
    .slogan { font-size: 0.8rem; margin: 2px auto; max-width: 95%; }
    
    /* Straight aligned navigation */
    .nav-buttons { display: flex; justify-content: center; flex-wrap: nowrap; gap: 4px; padding: 5px 0; }
    .nav-btn { padding: 4px 6px; font-size: 0.65rem; border-radius: 4px; background: rgba(153, 101, 21, 0.1); color: #996515; text-decoration: none; font-weight: bold; border: 1px solid #996515; white-space: nowrap; }

    .section2 { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .bg-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; animation: bgFade 20s infinite; }
    .bg-slide:nth-child(1) { background-image: url('imgbh1.jpeg'); animation-delay: 0s; }
    .bg-slide:nth-child(2) { background-image: url('imgbh2.jpeg'); animation-delay: 5s; }
    .bg-slide:nth-child(3) { background-image: url('imgbh3.jpeg'); animation-delay: 10s; }
    .bg-slide:nth-child(4) { background-image: url('imgbh4.jpeg'); animation-delay: 15s; }
    @keyframes bgFade { 0%, 12.5% { opacity: 1; } 25%, 100% { opacity: 0; } }

    /* Shadow Box effect applied here */
    .section-content { 
      position: relative; z-index: 1; padding: 20px; text-align: center; max-width: 90%; 
      background: rgba(0,0,0,0.75); border-radius: 15px; 
      box-shadow: 0 4px 15px rgba(255, 203, 164, 0.3), 0 0 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(218, 165, 32, 0.3);
    }
    h2 { font-size: 1.1rem; color: goldenrod; margin: 0 0 10px 0; }
    p { font-size: 0.85rem; margin-bottom: 15px; }
    
    .cta-buttons { display: flex; flex-direction: column; gap: 10px; }
    .cta-btn { padding: 8px; border-radius: 20px; text-decoration: none; font-size: 0.8rem; font-weight: bold; border: 1px solid goldenrod; color: goldenrod; }
    
    footer { text-align: center; padding: 8px; background-color: #996515; color: #FFCBA4; font-size: 0.6rem; }
  </style>
</head>
<body>

  <div class="section1">
    <img src="willona.png" alt="Willona Logo" class="logo">
    <h1 class="slogan"><b><i>We design moments that take your breath away.</i></b></h1>
    <div class="nav-buttons">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="services.html" class="nav-btn">Services</a>
      <a href="gallery.html" class="nav-btn">Gallery</a>
      <a href="contact.html" class="nav-btn">Contact</a>
      <a href="faq.html" class="nav-btn">FAQ</a>
    </div>
  </div>

  <div class="section2">
    <div class="bg-slide"></div> <div class="bg-slide"></div> <div class="bg-slide"></div> <div class="bg-slide"></div>
    <div class="section-content">
      <h2>Welcome to Willona’s Decor & Events</h2>
      <p>At Willona’s, we believe every occasion deserves beauty, elegance, and a touch of magic.</p>
      <div class="cta-buttons">
        <a href="https://wa.me/27685546465" class="cta-btn" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <a href="mailto:Mimi.Makhubo605@gmail.com" class="cta-btn"><i class="fas fa-envelope"></i> Email</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 Willona’s™ - We design moments that take your breath away.</p>
  </footer>
</body>
</html>
