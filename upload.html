<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Manager | Client Portal</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        h1 { color: #1a1a1a; margin-bottom: 8px; }
        p { color: #666; margin-bottom: 24px; }
        #upload-btn { background: #007bff; color: white; border: none; padding: 16px 32px; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s; }
        #upload-btn:hover { background: #0056b3; }
        #status { margin-top: 20px; color: #28a745; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello!</h1>
        <p>Upload new photos or videos to your website gallery here.</p>
        <button id="upload-btn">Add Media to Website</button>
        <div id="status">✅ Success! Your media is now live on the Gallery page.</div>
    </div>

    <script>
        const myWidget = cloudinary.createUploadWidget({
            cloudName: "dqiodxuuf", 
            uploadPreset: "unsigned_preset", // Ensure this is 'Unsigned' in your settings
            tags: ['client_gallery'],
            sources: ['local', 'url', 'camera'],
            clientAllowedFormats: ["png", "jpg", "jpeg", "mp4", "mov"],
            multiple: true
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                document.getElementById('status').style.display = "block";
            }
        });
        document.getElementById("upload-btn").addEventListener("click", () => myWidget.open(), false);
    </script>
</body>
</html>
